services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: on-failure

  payment_service:
    build: ./backend/payment_service
    networks:
      - internal
      - default
    restart: on-failure

  order_app:
    build: ./backend/order_app
    environment:
      RABBITMQ_HOST: rabbitmq
      PAYMENT_URL: http://payment_service:8000
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  consumer_notifikasi:
    build: ./backend/consumers
    command: ["python", "notifikasi.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  consumer_stok:
    build: ./backend/consumers
    command: ["python", "stok.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  consumer_laporan:
    build: ./backend/consumers
    command: ["python", "laporan.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
      LAPORAN_PATH: /logs/laporan_keuangan.log
    volumes:
      - ./logs:/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - order_app
    restart: on-failure

networks:
  internal:
    internal: true
